<script>
(()=>{
/* Egea OBD — şifreleme yardımcıları (giriş ekranı, kurulum ve yönetici ekranı ortak kullanır)
   AES-GCM 256 + PBKDF2-SHA256. Uygulama anahtarı (mk) her kullanıcı için o kullanıcının şifresinden türetilen
   anahtarla (kek) ayrı ayrı sarılır; kullanıcı listesi yalnızca yöneticinin açabildiği ayrı bir anahtarla (ak) şifrelenir.
   Herkese açık dosyada kimin yönetici olduğu ve kullanıcı adlarının uzunluğu görünmez (her kayıtta sahte yönetici alanı, sabit uzunlukta ad). */
const EGEAK=(()=>{
  const te=new TextEncoder(),td=new TextDecoder();
  const ITER=600000,MIN_PW={admin:12,user:10},NM_LEN=240;
  const DATA_OPEN="<scr"+"ipt id=\"egea-data\" type=\"application/json\">",DATA_PH="/*__EGEA_"+"DATA__*/";
  const b64=u8=>{let s="";for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);};
  const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
  /* Büyük/küçük harf ve I/İ/ı/i farkı gözetmeden karşılaştır */
  const norm=n=>String(n||"").trim().normalize("NFC").toLocaleLowerCase("tr").replace(/ı/g,"i");
  const nameOk=n=>/^[\p{L}\p{N}._-]{3,32}$/u.test(String(n||"").trim());
  const verOk=v=>/^[\w.\-]{1,40}$/.test(String(v||""));
  async function kdf(pw,salt,iter){
    const k=await crypto.subtle.importKey("raw",te.encode(String(pw).normalize("NFC")),"PBKDF2",false,["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt,iterations:iter},k,256));
  }
  const imp=raw=>crypto.subtle.importKey("raw",raw,"AES-GCM",false,["encrypt","decrypt"]);
  async function enc(keyRaw,bytes){const iv=rnd(12);const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},await imp(keyRaw),bytes));return b64(iv)+"."+b64(ct);}
  async function dec(keyRaw,s){const p=String(s).split(".");return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(p[0])},await imp(keyRaw),ub64(p[1])));}
  async function gz(str){const st=new Blob([str]).stream().pipeThrough(new CompressionStream("gzip"));return new Uint8Array(await new Response(st).arrayBuffer());}
  async function gunzip(bytes){const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));return await new Response(st).text();}
  async function sha(s){return b64(new Uint8Array(await crypto.subtle.digest("SHA-256",te.encode(s))));}
  const uid=name=>sha("egea-obd|"+norm(name));
  /* Cihazdaki verinin anahtarı: ad + hesabın oluşturulma zamanı (aynı adla yeniden açılan hesap eski veriyi görmez) */
  const storeKey=async(name,created)=>(await sha("egea-store|"+norm(name)+"|"+(created||0))).replace(/[^A-Za-z0-9]/g,"").slice(0,20);
  /* Yeni kullanıcı kaydı: şifre burada anahtara çevrilir, şifrenin kendisi hiçbir yerde saklanmaz */
  async function mkUser(name,pw,role){
    if(!nameOk(name))throw new Error("Kullanıcı adı 3–32 karakter olmalı; harf, rakam, nokta, tire ve alt çizgi kullanılabilir.");
    if(String(pw).length<MIN_PW[role])throw new Error(`Şifre en az ${MIN_PW[role]} karakter olmalı.`);
    const salt=rnd(16);const kek=await kdf(pw,salt,ITER);
    return {name:String(name).trim(),role,salt:b64(salt),iter:ITER,kek:b64(kek),created:Date.now()};
  }
  /* Şablondaki veri yerini bul: tam olarak bir kez bulunmalı */
  function slot(tpl){const a=tpl.indexOf(DATA_OPEN+DATA_PH);if(a<0||tpl.indexOf(DATA_OPEN+DATA_PH,a+1)>=0)throw new Error("Giriş ekranı şablonu geçersiz.");return a+DATA_OPEN.length;}
  function readData(html){const a=html.indexOf(DATA_OPEN);if(a<0)throw new Error("Dosyada veri bulunamadı.");const b=html.indexOf("<",a+DATA_OPEN.length);return JSON.parse(html.slice(a+DATA_OPEN.length,b));}
  /* Şifreli index.html üret. Her üretimde anahtarlar yenilenir: silinen kullanıcının eski anahtarı yeni dosyayı açamaz */
  async function build(o){
    if(!verOk(o.ver))throw new Error("Sürüm bilgisi geçersiz.");
    const at=slot(o.loaderTpl);
    const mk=rnd(32),ak=rnd(32);
    const recs=[],seen=new Set();
    for(const u of o.users){
      const id=await uid(u.name);if(seen.has(id))throw new Error(`"${u.name}" adı listede iki kez var.`);seen.add(id);
      const k=ub64(u.kek);
      const nm=te.encode(JSON.stringify({n:u.name,c:u.created||0}).padEnd(NM_LEN," "));
      recs.push({id,salt:u.salt,iter:u.iter||ITER,wk:await enc(k,mk),wa:u.role==="admin"?await enc(k,ak):await enc(rnd(32),rnd(32)),nm:await enc(k,nm)});
    }
    recs.sort((a,b)=>a.id<b.id?-1:1);
    const updated=Date.now();
    const data={v:1,ver:o.ver,users:recs,app:await enc(mk,await gz(o.appHtml)),meta:await enc(ak,te.encode(JSON.stringify({users:o.users,updated,ver:o.ver})))};
    const LT="\\"+"u003c";
    const json=JSON.stringify(data).replace(/</g,LT);
    return {html:o.loaderTpl.slice(0,at)+json+o.loaderTpl.slice(at+DATA_PH.length),updated};
  }
  /* Giriş: kullanıcı adı + şifre (ya da cihazda saklı anahtar) ile uygulamayı çöz */
  async function open(D,name,pw,kekB64){
    if(!D||D.v!==1)throw new Error("Desteklenmeyen dosya sürümü.");
    const id=await uid(name);const r=D.users.find(x=>x.id===id);
    if(!r)throw new Error("auth");
    const kek=kekB64?ub64(kekB64):await kdf(pw,ub64(r.salt),r.iter||ITER);
    let mk;try{mk=await dec(kek,r.wk);}catch(e){throw new Error("auth");}
    const html=await gunzip(await dec(mk,D.app));
    let meta=null,role="user";
    try{const ak=await dec(kek,r.wa);meta=JSON.parse(td.decode(await dec(ak,D.meta)));role="admin";}catch(e){}
    let disp=String(name).trim(),created=0;
    try{const j=JSON.parse(td.decode(await dec(kek,r.nm)).trim());disp=j.n||disp;created=j.c||0;}catch(e){}
    return {html,role,meta,name:disp,created,kek:b64(kek),skey:await storeKey(disp,created)};
  }
  const okBrowser=()=>!!(window.crypto&&crypto.subtle&&window.CompressionStream&&window.DecompressionStream);
  return {ITER,MIN_PW,b64,ub64,rnd,norm,nameOk,verOk,kdf,enc,dec,gz,gunzip,uid,mkUser,build,readData,open,okBrowser};
})();

const $=id=>document.getElementById(id);
const err=m=>{$("e").textContent=m||"";};
let D=null;try{D=JSON.parse($("egea-data").textContent);}catch(e){}
const store=()=>{try{return window.localStorage;}catch(e){return null;}};
const sess=()=>{try{return window.sessionStorage;}catch(e){return null;}};
function saved(){for(const s of [sess(),store()]){try{const v=s&&s.getItem("egeaAuth");if(v)return JSON.parse(v);}catch(e){}}return null;}
function forget(){for(const s of [sess(),store()]){try{s&&s.removeItem("egeaAuth");}catch(e){}}}
function launch(o){
  const admin=o.role==="admin";
  window.__EGEA={user:o.name,role:o.role,skey:o.skey,ver:D.ver,meta:admin?o.meta:null,appHtml:admin?o.html:null,kek:admin?o.kek:null,
    logout(){forget();location.reload();}};
  document.open();document.write(o.html);document.close();
}
async function auto(){
  const a=saved();if(!a)return false;
  try{launch(await EGEAK.open(D,a.name,null,a.kek));return true;}
  catch(e){forget();err(e.message==="auth"?"Oturumun sona erdi (şifren değişmiş ya da erişimin kaldırılmış olabilir). Lütfen yeniden giriş yap.":"Uygulama açılamadı: "+e.message);return false;}
}
$("f").addEventListener("submit",async ev=>{
  ev.preventDefault();err("");
  if(!EGEAK.okBrowser()){err("Bu tarayıcı desteklenmiyor. Güncel Chrome veya Edge kullanın.");return;}
  const name=$("u").value.trim(),pw=$("p").value;if(!name||!pw)return;
  $("b").disabled=true;$("b").textContent="Açılıyor…";
  try{
    const o=await EGEAK.open(D,name,pw);
    const rec=JSON.stringify({name:o.name,kek:o.kek});
    forget();const s=$("r").checked&&o.role!=="admin"?store():sess();try{s&&s.setItem("egeaAuth",rec);}catch(e){}
    launch(o);
  }catch(e){
    err(e.message==="auth"?"Kullanıcı adı veya şifre hatalı.":"Uygulama açılamadı: "+e.message);
    $("b").disabled=false;$("b").textContent="Giriş yap";
  }
});
if(!D||D.v!==1){err("Uygulama dosyası bozuk ya da bu sürüm desteklenmiyor. Yöneticiye bildirin.");$("b").disabled=true;}
else if(!window.isSecureContext||!EGEAK.okBrowser())err("Bu tarayıcı veya adres desteklenmiyor. Güncel Chrome veya Edge ile https adresinden açın.");
else auto().then(ok=>{if(!ok)$("u").focus();});
})();
</script>
